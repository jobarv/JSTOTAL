<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript TOTAL</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>
    <h1 id="titulo" onmouseover="ponerTituloRojo()">Bienvenido a JavaScript TOTAL</h1>
    <li><a href="./index.html">Regresa al Indice</a></li>
    <br>
    <main>
        <p>Ingresa tu Nombre</p>
        <input type="text" id="nombreDeUsuario">
        <button type="button" onclick="mostrarNombre()">Ingresar</button>

        <h1 id="salida">No sé tu nombre</h1>
    </main>


    <script>
        function mostrarNombre() {
            let elementoNombre = document.getElementById("nombreDeUsuario");
            let elementoTexto = document.getElementById("salida");
            let mensaje = "Tu te llamas " + elementoNombre.value;


            elementoTexto.textContent = mensaje;
        }
    </script>
</body>

</html>
